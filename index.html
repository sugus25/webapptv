<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>IPTV Player — Dark Edition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.21/dist/hls.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/shaka-player@4.13.0/dist/shaka-player.compiled.js"></script>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; font-family: 'Noto Sans Thai', sans-serif; }
  body { background: #0f0f1a; color: #e5e7eb; }

  header {
    background: linear-gradient(180deg, #12121f 0%, #1a1a2e 100%);
    padding: 12px 16px; display: flex; align-items: center; gap: 12px;
    position: relative; z-index: 10; border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .menu-btn {
    width: 36px; height: 36px; border-radius: 8px; background: rgba(255,255,255,0.08);
    display: flex; align-items: center; justify-content: center; font-size: 20px;
    border: none; color: #e5e7eb; cursor: pointer;
  }
  .logo {
    width: 32px; height: 32px; border-radius: 8px;
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    display:flex; align-items:center; justify-content:center; font-size:20px;
  }
  .header-title { font-size: 18px; font-weight: 700; flex: 1; color: #f9fafb; }

  .add-section {
    background: #1a1a2e; padding: 16px; border-bottom-left-radius: 20px;
    border-bottom-right-radius: 20px; border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .add-title { font-size: 15px; font-weight: 600; margin-bottom: 10px; color: #d1d5db; }
  .input-url {
    width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.08);
    background: #24243f; color: #f9fafb; font-size: 15px; outline: none; margin-bottom: 12px;
  }
  .input-url::placeholder { color: #6b7280; }
  .btn-add {
    width: 100%; padding: 14px; border-radius: 10px; border: none;
    background: linear-gradient(90deg, #6366f1, #8b5cf6); color: #fff;
    font-size: 16px; font-weight: 700; cursor: pointer;
  }

  .list-section { padding: 16px; }
  .section-title { font-size: 15px; font-weight: 600; margin-bottom: 12px; color: #9ca3af; }
  .playlist-item {
    background: #1a1a2e; border-radius: 12px; padding: 14px; margin-bottom: 10px;
    display: flex; align-items: center; gap: 12px; cursor: pointer;
    border: 1px solid transparent;
  }
  .playlist-item:hover { background: #24243f; border-color: #6366f1; }
  .pl-icon {
    width: 48px; height: 48px; border-radius: 10px;
    background: linear-gradient(135deg, #3730a3, #4f46e5);
    display: flex; align-items: center; justify-content: center; font-size: 24px; flex-shrink:0;
  }
  .pl-info { flex: 1; min-width:0; }
  .pl-name { font-size: 15px; font-weight: 600; margin-bottom: 2px; color: #f3f4f6; }
  .pl-src { font-size: 12px; color: #818cf8; }
  .pl-menu {
    width: 36px; height: 36px; border-radius: 6px; background: rgba(255,255,255,0.05);
    display: flex; align-items: center; justify-content: center; font-size: 18px;
    color: #9ca3af; border:none; cursor:pointer; flex-shrink:0;
  }

  .page { display: none; height: 100%; overflow-y: auto; position:absolute; inset:0; background:#0f0f1a; }
  .page.active { display: block; }
  .page-header {
    background: #12121f; padding: 12px 16px; display: flex; align-items: center; gap: 12px;
    position: sticky; top: 0; z-index: 5; border-bottom:1px solid rgba(255,255,255,0.05);
  }
  .back-btn {
    font-size: 20px; color: #e5e7eb; text-decoration: none;
    width:36px; height:36px; display:flex; align-items:center; justify-content:center;
    border-radius:50%; background:rgba(255,255,255,0.08);
  }
  .page-title { font-size: 18px; font-weight: 700; color: #f9fafb; }
  .cat-toolbar {
    padding: 12px 16px; display: flex; gap: 10px; align-items: center;
    border-bottom:1px solid rgba(255,255,255,0.05); background: #12121f;
  }
  .search-cat {
    flex: 1; padding: 10px 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.08);
    background: #24243f; color: #f9fafb; font-size: 14px; outline: none;
  }
  .view-btn {
    padding: 8px 14px; border-radius: 8px; border: none;
    background: rgba(255,255,255,0.08); color: #d1d5db;
    font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .view-btn.active { background: linear-gradient(90deg, #6366f1, #8b5cf6); color: #fff; }
  .cat-grid { padding: 16px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .cat-list { padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .cat-card {
    background: #1a1a2e; border-radius: 12px; padding: 16px; cursor: pointer;
    border: 1px solid rgba(255,255,255,0.05);
  }
  .cat-card:hover { background: #24243f; border-color: #6366f1; }
  .cat-card.grid-item { text-align: center; }
  .cat-icon { font-size: 36px; margin-bottom: 8px; }
  .cat-name { font-size: 15px; font-weight: 600; margin-bottom: 4px; color: #f3f4f6; }
  .cat-count { font-size: 12px; color: #818cf8; }
  .cat-card.list-item { display: flex; align-items: center; gap: 12px; }
  .cat-card.list-item .cat-icon { font-size: 28px; margin-bottom: 0; width: 40px; flex-shrink:0; }

  .type-buttons { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .type-btn {
    padding: 10px 16px; border-radius: 8px; border: none; background: #1a1a2e;
    color: #d1d5db; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .type-btn.active { background: linear-gradient(90deg, #6366f1, #8b5cf6); color: #fff; }
  .form-group { margin-bottom: 14px; }
  .form-label { font-size: 14px; font-weight: 500; margin-bottom: 6px; color: #9ca3af; display:block; }
  .form-input {
    width: 100%; padding: 12px 14px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.08);
    background: #24243f; color: #f9fafb; font-size: 14px; outline: none;
  }
  textarea.form-input { resize:vertical; min-height:80px; }
  .btn-row { display: flex; gap: 8px; }
  .btn-copy { padding: 12px 16px; border-radius: 8px; border: none; background: #d97706; color: #fff; font-weight: 600; cursor: pointer; white-space:nowrap; }
  .btn-test {
    width: 100%; padding: 14px; border-radius: 10px; border: none;
    background: linear-gradient(90deg, #059669, #10b981); color: #fff;
    font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 8px;
  }
  .test-container { padding:20px; }

  .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
  .modal.show { display: flex; }
  .modal-box { width: 100%; max-width: 360px; background: #1a1a2e; border-radius: 20px; padding: 24px; border: 1px solid rgba(255,255,255,0.05); }
  .modal-title { text-align: center; font-size: 18px; font-weight: 700; margin-bottom: 20px; color: #f9fafb; }
  .menu-option {
    width: 100%; padding: 14px; border-radius: 10px; border: none; font-size: 15px; font-weight: 600;
    margin-bottom: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; color:#fff;
  }
  .menu-file { background: #7c3aed; }
  .menu-qr { background: #0d9488; }
  .menu-premium { background: #d97706; }
  .menu-test { background: #be185d; }
  .menu-settings { background: #4b5563; }
  .menu-close { background: transparent; color: #ef4444; border: 1px solid rgba(239,68,68,0.3); font-size: 16px; font-weight: 700; margin-top: 8px; }

  .player-modal { position: fixed; inset: 0; background: #000; display: none; flex-direction: column; z-index: 200; }
  .player-modal.show { display: flex; }
  .player-header {
    padding: 12px 16px; display: flex; align-items: center; gap: 12px;
    background: #12121f; flex-shrink:0; border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .player-title { flex: 1; font-size: 16px; font-weight: 600; color: #f9fafb; }
  video { width: 100%; background: #000; flex: 1; object-fit: cover; }
  .player-bar {
    padding: 12px 16px; background: #12121f; display: flex; gap: 10px;
    flex-wrap: wrap; flex-shrink:0; border-top: 1px solid rgba(255,255,255,0.05);
  }
  .player-btn {
    flex: 1; min-width: 100px; padding: 10px; border-radius: 8px; border: none;
    color: #fff; font-weight: 600; cursor: pointer;
  }
  .btn-yamby { background: #7c3aed; }
  .btn-external { background: #dc2626; }
  .btn-copy { background: #374151; }

  #fileInput { display:none; }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: #3f3f5a; border-radius: 3px; }
</style>
</head>
<body>

<input type="file" id="fileInput" accept=".m3u,.m3u8,.json,.w3u,.txt">

<div id="mainPage" class="page active">
  <header>
    <button class="menu-btn" id="mainMenuBtn">☰</button>
    <div class="logo">🎬</div>
    <h1 class="header-title">IPTV Player — Dark</h1>
  </header>

  <div class="add-section">
    <h2 class="add-title">เพิ่มเพลย์ลิสต์ใหม่ (JSON / W3U / M3U)</h2>
    <input type="text" class="input-url" id="playlistUrl" placeholder="วางลิงก์ URL ที่นี่...">
    <button class="btn-add" id="addPlaylistBtn">📁 นำเข้าลิงก์</button>
  </div>

  <div class="list-section">
    <h2 class="section-title">เพลย์ลิสต์ทั้งหมด (<span id="plCount">0</span>)</h2>
    <div id="playlistList"></div>
  </div>
</div>

<div id="catPage" class="page">
  <div class="page-header">
    <a href="#" class="back-btn" id="catBack">←</a>
    <h2 class="page-title" id="plName">หมวดหมู่</h2>
  </div>
  <div class="cat-toolbar">
    <input type="text" class="search-cat" id="catSearch" placeholder="ค้นหากลุ่ม/หมวดหมู่...">
    <button class="view-btn active" id="gridBtn">กริด</button>
    <button class="view-btn" id="listBtn">รายการ</button>
  </div>
  <div id="catContainer" class="cat-grid"></div>
</div>

<div id="testPage" class="page">
  <div class="page-header">
    <a href="#" class="back-btn" id="testBack">←</a>
    <h2 class="page-title">ทดสอบลิงก์</h2>
  </div>
  <div class="test-container">
    <p style="font-size: 14px; color: #9ca3af; margin-bottom: 16px;">เลือกประเภทลิงก์</p>
    <div class="type-buttons">
      <button class="type-btn active" data-type="play">play</button>
      <button class="type-btn" data-type="web_url">web_url</button>
      <button class="type-btn" data-type="m3u8">m3u8</button>
      <button class="type-btn" data-type="mp4">mp4</button>
      <button class="type-btn" data-type="mpd">mpd</button>
    </div>

    <div class="form-group">
      <label class="form-label">ลิงก์วิดีโอ (URL)</label>
      <div class="btn-row">
        <input type="text" class="form-input" id="testUrl" placeholder="https://..." style="flex:1;">
        <button class="btn-copy" id="pasteUrlBtn">วาง</button>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Referer (ถ้ามี)</label>
      <div class="btn-row">
        <input type="text" class="form-input" id="testReferer" placeholder="https://example.com" style="flex:1;">
        <button class="btn-copy" id="pasteRefererBtn">วาง</button>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">User-Agent (ถ้าจำเป็น)</label>
      <textarea class="form-input" id="testUA">Mozilla/5.0 (Linux; Android 12) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Mobile Safari/537.36</textarea>
    </div>

    <button class="btn-test" id="playTestBtn">▶ ทดสอบเล่น</button>
  </div>
</div>

<div class="modal" id="menuModal">
  <div class="modal-box">
    <h3 class="modal-title">เมนูทางลัด</h3>
    <button class="menu-option menu-file" id="fileMenuBtn">📁 ไฟล์ในเครื่อง</button>
    <button class="menu-option menu-qr" id="qrMenuBtn">📷 สแกน QR</button>
    <button class="menu-option menu-premium">⭐ รายการโปรด</button>
    <button class="menu-option menu-test" id="goTestBtn">🔗 ทดสอบลิงก์</button>
    <button class="menu-option menu-settings">⚙️ ตั้งค่า</button>
    <button class="menu-option menu-close" id="closeMenuBtn">✕ ปิด</button>
  </div>
</div>

<div class="player-modal" id="playerModal">
  <div class="player-header">
    <a href="#" class="player-back" id="playerBack">←</a>
    <h3 class="player-title" id="playerTitle">กำลังเล่น...</h3>
  </div>
  <video id="video" controls playsinline preload="metadata"></video>
  <div class="player-bar">
    <button class="player-btn btn-yamby" id="yambyBtn">▶ Yamby</button>
    <button class="player-btn btn-external" id="extBtn">📱 แอปอื่น</button>
    <button class="player-btn btn-copy" id="copyLinkBtn">📋 คัดลอก</button>
  </div>
</div>

<script>
"use strict";

if (window.shaka && shaka.polyfill) shaka.polyfill.installAll();

const S = {
  playlists: [], currentPL: null, currentCat: null, currentItem: null,
  viewMode: 'grid', selectedType: 'play', hls: null, shakaPlayer: null
};
const $ = id => document.getElementById(id);

function init() {
  try { const saved = localStorage.getItem('wp_playlists'); if (saved) S.playlists = JSON.parse(saved); }
  catch(e) { console.log('โหลดรายการว่าง'); }
  renderPlaylists();
  bindEvents();
}

function savePlaylists() {
  localStorage.setItem('wp_playlists', JSON.stringify(S.playlists));
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function renderPlaylists() {
  const list = $('playlistList');
  $('plCount').textContent = S.playlists.length;
  if (!S.playlists.length) {
    list.innerHTML = '<p style="color:#9ca3af;text-align:center;padding:30px 20px;">ยังไม่มีเพลย์ลิสต์<br>เพิ่มลิงก์ด้านบน หรือเลือกไฟล์ในเครื่องจากเมนู ☰</p>';
    return;
  }
  list.innerHTML = S.playlists.map((pl, idx) => `
    <div class="playlist-item" data-idx="${idx}">
      <div class="pl-icon">📺</div>
      <div class="pl-info">
        <div class="pl-name">${escapeHtml(pl.name || 'เพลย์ลิสต์ ' + (idx+1))}</div>
        <div class="pl-src">${(pl.type || 'M3U').toUpperCase()}</div>
      </div>
      ${pl.vip ? '<span class="pl-vip">VIP</span>' : ''}
      <button class="pl-menu" data-idx="${idx}" title="ตัวเลือก">⋮</button>
    </div>
  `).join('');
  
  list.querySelectorAll('.playlist-item').forEach(el => {
    el.querySelector('.pl-menu').onclick = e => {
      e.stopPropagation();
      if (confirm('ลบเพลย์ลิสต์นี้?')) {
        S.playlists.splice(parseInt(el.dataset.idx), 1);
        savePlaylists();
        renderPlaylists();
      }
    };
    el.onclick = e => {
      if (!e.target.classList.contains('pl-menu')) openPlaylist(parseInt(el.dataset.idx));
    };
  });
}

async function openPlaylist(idx) {
  S.currentPL = S.playlists[idx];
  $('plName').textContent = S.currentPL.name || 'หมวดหมู่';
  switchPage('catPage');
  
  if (!S.currentPL.data) {
    $('catContainer').innerHTML = '<div style="text-align:center;padding:40px;"><div style="width:30px;height:30px;border:3px solid #6366f1;border-top-color:transparent;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 16px;"></div>กำลังโหลด...</div>';
    try {
      S.currentPL.data = await loadPlaylist(S.currentPL.url);
      S.playlists[idx].data = S.currentPL.data;
      savePlaylists();
    } catch(err) {
      $('catContainer').innerHTML = `<div style="text-align:center;padding:40px;color:#f87171;">โหลดไม่ได้: ${err.message}</div>`;
      return;
    }
  }
  renderCategories();
}

async function loadPlaylist(url) {
  let text = '', data = { cats: [], items: {} };
  
  if (url.startsWith('blob:')) {
    const resp = await fetch(url);
    text = await resp.text();
    URL.revokeObjectURL(url);
  } else {
    try {
      const r = await fetch(url, { cache: 'no-store' });
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      text = await r.text();
    } catch (e) {
      try {
        const proxyUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(url);
        const r2 = await fetch(proxyUrl);
        if (!r2.ok) throw new Error(`Proxy ${r2.status}`);
        text = await r2.text();
      } catch (e2) {
        throw new Error('ไม่สามารถโหลดลิงก์ได้ อาจเป็นเพราะ CORS หรือลิงก์ไม่ถูกต้อง');
      }
    }
  }
  
  if (!text || text.trim().length === 0) throw new Error('ไฟล์ว่างหรือไม่มีเนื้อหา');

  const low = url.toLowerCase();
  if (low.endsWith('.json') || low.endsWith('.w3u') || text.trim()[0] === '{') {
    try { data = parseJson(JSON.parse(text)); } 
    catch(e) { throw new Error('รูปแบบ JSON ไม่ถูกต้อง: ' + e.message); }
  } else if (text.includes('#EXTINF')) {
    data = parseM3U(text);
  } else {
    throw new Error('ไม่รู้จักรูปแบบไฟล์ ต้องเป็น .m3u / .json / .w3u');
  }
  
  if (data.cats.length === 0) throw new Error('ไม่พบรายการในเพลย์ลิสต์');
  return data;
}

function parseJson(obj) {
  const data = { cats: [], items: {} };
  if (!obj) return data;
  
  if (Array.isArray(obj)) {
    obj.forEach(item => processItem(item, data, 'ทั่วไป'));
    return data;
  }
  
  if (obj.groups && Array.isArray(obj.groups)) {
    obj.groups.forEach(g => {
      const groupName = g.name || 'กลุ่ม';
      const cid = makeCatId(groupName);
      addCat(data, cid, groupName, '📁');
      if (g.stations && Array.isArray(g.stations)) {
        g.stations.forEach(s => {
          addItem(data, cid, {
            name: s.name || 'ไม่มีชื่อ',
            url: s.url || s.stream || s.link || '',
            logo: s.image || s.logo || g.image || ''
          });
        });
      }
    });
    return data;
  }
  
  if (obj.channels && Array.isArray(obj.channels)) {
    obj.channels.forEach(item => processItem(item, data, 'ช่อง'));
  }
  if (obj.items && Array.isArray(obj.items)) {
    obj.items.forEach(item => processItem(item, data, 'รายการ'));
  }
  
  return data;
}

function processItem(item, data, defaultGroup) {
  const group = item.group || item.group_title || defaultGroup;
  const cid = makeCatId(group);
  addCat(data, cid, group, '📺');
  addItem(data, cid, {
    name: item.name || item.title || 'ไม่มีชื่อ',
    url: item.url || item.stream || item.link || '',
    logo: item.logo || item.image || item.tvgLogo || ''
  });
}

function makeCatId(name) {
  return 'cat_' + btoa(encodeURIComponent(name)).replace(/[+=/]/g, '_').slice(0, 20);
}

function addCat(data, id, name, icon) {
  if (!data.cats.find(c => c.id === id)) {
    data.cats.push({ id, name, icon });
    data.items[id] = [];
  }
}

function addItem(data, catId, item) {
  if (item.url) data.items[catId].push(item);
}

function parseM3U(text) {
  const data = { cats: [], items: {} };
  const lines = text.split(/\r?\n/);
  let name = '', url = '', group = 'ทั่วไป', logo = '';
  let foundAny = false;

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i].trim();
    if (!line) continue;

    if (line.startsWith('#EXTINF')) {
      foundAny = true;
      const g = line.match(/group-title="([^"]*)"/i);
      group = (g && g[1]) ? g[1].trim() : 'ทั่วไป';
      
      const l = line.match(/tvg-logo="([^"]*)"/i);
      logo = l ? l[1] : '';
      
      const c = line.indexOf(',');
      name = c > -1 ? line.slice(c + 1).trim() : 'ช่อง ' + (i + 1);
      url = '';
    } 
    else if (!line.startsWith('#') && line.length > 5) {
      url = line;
      if (name && url) {
        const cid = makeCatId(group);
        addCat(data, cid, group, '📺');
        addItem(data, cid, { name, url, logo });
      }
      name = url = logo = '';
    }
  }

  if (!foundAny) throw new Error('ไม่พบรายการ #EXTINF ในไฟล์ M3U');
  return data;
}

function renderCategories(filter = '') {
  const f = filter.toLowerCase().trim();
  let cats = S.currentPL.data.cats;
  if (f) cats = cats.filter(c => c.name.toLowerCase().includes(f));
  
  const container = $('catContainer');
  container.className = S.viewMode === 'grid' ? 'cat-grid' : 'cat-list';
  
  if (!cats.length) {
    container.innerHTML = '<p style="text-align:center;color:#9ca3af;padding:40px;">ไม่พบหมวดหมู่</p>';
    return;
  }
  
  container.innerHTML = cats.map(cat => `
    <div class="cat-card ${S.viewMode === 'grid' ? 'grid-item' : 'list-item'}" data-cat="${cat.id}">
      <div class="cat-icon">${cat.icon || '📁'}</div>
      <div>
        <div class="cat-name">${escapeHtml(cat.name)}</div>
        <div class="cat-count">${S.currentPL.data.items[cat.id]?.length || 0} รายการ</div>
      </div>
    </div>
  `).join('');
  
  container.querySelectorAll('.cat-card').forEach(el => {
    el.onclick = () => openCategory(el.dataset.cat);
  });
}

function openCategory(catId) {
  S.currentCat = catId;
  const items = S.currentPL.data.items[catId] || [];
  const container = $('catContainer');
  
  if (!items.length) {
    container.innerHTML = '<p style="text-align:center;color:#9ca3af;padding:40px;">ไม่มีรายการในหมวดนี้</p>';
    return;
  }
  
  container.innerHTML = `
    <div style="grid-column:1/-1; margin-bottom:12px;">
      <button class="view-btn" style="background:rgba(255,255,255,0.1);" id="backToCats">← กลับหมวดหมู่</button>
    </div>
  `;
  container.insertAdjacentHTML('beforeend', items.map(it => `
    <div class="cat-card ${S.viewMode === 'grid' ? 'grid-item' : 'list-item'}" data-url="${escapeHtml(it.url)}" data-name="${escapeHtml(it.name)}">
      <div class="cat-icon" style="${it.logo ? `background:url('${it.logo}') center/cover no-repeat;` : ''}">📺</div>
      <div>
        <div class="cat-name">${escapeHtml(it.name)}</div>
      </div>
    </div>
  `).join(''));
  
  $('backToCats').onclick = () => renderCategories($('catSearch').value);
  
  container.querySelectorAll('.cat-card').forEach(el => {
    el.onclick = () => openItem(el.dataset.name, el.dataset.url);
  });
}

function getMimeType(url) { return 'video/*'; }

function openItem(name, url) {
  if (!url) return alert('ไม่มีลิงก์วิดีโอ');
  S.currentItem = { name, url };
  $('playerTitle').textContent = name;
  $('playerModal').classList.add('show');
  document.body.style.overflow = 'hidden';
  playVideo(url);
}

function stopAll() {
  const v = $('video');
  v.pause();
  v.removeAttribute('src');
  v.load();
  
  if (S.hls) { try { S.hls.destroy(); } catch(e) {} S.hls = null; }
  if (S.shakaPlayer) { try { S.shakaPlayer.unload(); S.shakaPlayer.destroy(); } catch(e) {} S.shakaPlayer = null; }
}

async function playVideo(rawUrl) {
  stopAll();
  const v = $('video');
  let url = rawUrl, ref = '';
  
  if (rawUrl.includes('|referer=')) {
    const parts = rawUrl.split('|referer=');
    url = parts[0].trim();
    ref = parts[1]?.trim() || '';
  }

  console.log('▶ กำลังเล่น:', url, ref ? '(Referer: ' + ref + ')' : '');

  if (url.toLowerCase().includes('.mpd')) {
    if (!shaka.Player.isBrowserSupported()) {
      alert('เบราว์เซอร์ไม่รองรับไฟล์ .mpd (DASH)');
      return;
    }
    try {
      S.shakaPlayer = new shaka.Player(v);
      if (ref) {
        const net = S.shakaPlayer.getNetworkingEngine();
        net.registerRequestFilter((type, request) => {
          request.headers['Referer'] = ref;
          return request;
        });
      }
      await S.shakaPlayer.load(url);
      v.play().catch(e => console.log('Autoplay blocked:', e));
    } catch (e) {
      console.error('Shaka Error:', e);
      alert(`เล่นไฟล์ .mpd ไม่ได้\n${e.message}`);
    }
    return;
  }

  if (url.toLowerCase().includes('.m3u8')) {
    if (Hls.isSupported()) {
      S.hls = new Hls({ maxBufferLength: 30, maxMaxBufferLength: 60, debug: false });
      if (ref) {
        S.hls.xhrSetup = function(xhr, url) {
          xhr.setRequestHeader('Referer', ref);
        };
      }
      S.hls.loadSource(url);
      S.hls.attachMedia(v);
      S.hls.on(Hls.Events.MANIFEST_PARSED, () => {
        v.play().catch(e => console.log('Autoplay blocked:', e));
      });
      S.hls.on(Hls.Events.ERROR, (event, data) => {
        if (data.fatal) {
          if (data.type === Hls.ErrorTypes.NETWORK_ERROR) alert('เกิดข้อผิดพลาดเครือข่าย');
          else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) S.hls.recoverMediaError();
          else { S.hls.destroy(); alert('เล่นไม่ได้'); }
        }
      });
    } 
    else if (v.canPlayType('application/vnd.apple.mpegurl')) {
      v.src = url;
      v.play().catch(e => console.log('Autoplay blocked:', e));
    } else {
      alert('เบราว์เซอร์ไม่รองรับไฟล์ .m3u8');
    }
    return;
  }

  v.src = url;
  v.onerror = () => alert('ไม่สามารถเล่นวิดีโอได้');
  v.play().catch(e => alert('กดปุ่มเล่นเพื่อเริ่มดูวิดีโอ'));
}

function switchPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  $(id).classList.add('active');
}

function bindEvents() {
  $('mainMenuBtn').onclick = () => $('menuModal').classList.add('show');
  $('closeMenuBtn').onclick = () => $('menuModal').classList.remove('show');
  $('menuModal').onclick = e => { if (e.target === $('menuModal')) $('menuModal').classList.remove('show'); };
  
  $('fileMenuBtn').onclick = () => {
    $('menuModal').classList.remove('show');
    $('fileInput').click();
  };
  $('fileInput').onchange = async e => {
    const file = e.target.files[0];
    if (!file) return;
    try {
      const url = URL.createObjectURL(file);
      S.playlists.push({
        name: file.name, url: url,
        type: file.name.split('.').pop().toUpperCase(), data: null
      });
      savePlaylists();
      renderPlaylists();
      alert('✅ นำเข้าไฟล์สำเร็จ: ' + file.name);
    } catch(err) {
      alert('❌ นำเข้าไม่ได้: ' + err.message);
    }
    $('fileInput').value = '';
  };

  $('qrMenuBtn').onclick = () => {
    $('menuModal').classList.remove('show');
    alert('สแกน QR แล้วคัดลอกลิงก์มาวางได้เลยครับ');
  };

  $('goTestBtn').onclick = () => {
    $('menuModal').classList.remove('show');
    switchPage('testPage');
  };

  $('addPlaylistBtn').onclick = () => {
    const url = $('playlistUrl').value.trim();
    if (!url) return alert('กรุณาใส่ลิงก์ URL');
    const name = prompt('ตั้งชื่อเพลย์ลิสต์:') || 'เพลย์ลิสต์ ' + (S.playlists.length + 1);
    S.playlists.push({ name, url, type: url.split('.').pop().toUpperCase(), data: null });
    savePlaylists();
    $('playlistUrl').value = '';
    renderPlaylists();
    alert('✅ เพิ่มสำเร็จ! กดที่ชื่อเพื่อโหลดเนื้อหา');
  };

  $('catBack').onclick = () => { S.currentPL = null; switchPage('mainPage'); };
  $('catSearch').oninput = e => renderCategories(e.target.value);
  $('gridBtn').onclick = () => { S.viewMode = 'grid'; $('gridBtn').classList.add('active'); $('listBtn').classList.remove('active'); renderCategories(); };
  $('listBtn').onclick = () => { S.viewMode = 'list'; $('listBtn').classList.add('active'); $('gridBtn').classList.remove('active'); renderCategories(); };

  $('testBack').onclick = () => switchPage('mainPage');
  document.querySelectorAll('.type-btn').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      S.selectedType = btn.dataset.type;
    };
  });
  
  $('pasteUrlBtn').onclick = async () => {
    try { const t = await navigator.clipboard.readText(); if (t) $('testUrl').value = t.trim(); } catch(e) {}
  };
  $('pasteRefererBtn').onclick = async () => {
    try { const t = await navigator.clipboard.readText(); if (t) $('testReferer').value = t.trim(); } catch(e) {}
  };

  $('playTestBtn').onclick = () => {
    const url = $('testUrl').value.trim();
    const ref = $('testReferer').value.trim();
    if (!url) return alert('กรุณาใส่ลิงก์วิดีโอ');
    openItem('ทดสอบเล่น', ref ? `${url}|referer=${ref}` : url);
  };

  $('playerBack').onclick = () => {
    $('playerModal').classList.remove('show');
    document.body.style.overflow = '';
    stopAll();
  };
  
  $('yambyBtn').onclick = () => {
    if (!S.currentItem) return alert('ไม่มีลิงก์วิดีโอ');
    const url = S.currentItem.url;
    const mimeType = getMimeType(url);
    const u = url.replace(/^https?:\/\//, '');
    window.location.href = `intent://${u}#Intent;package=com.hush.yamby;S.userAgent=exo_player;S.title=${encodeURIComponent(S.currentItem.name)};S.referer=;scheme=https;type=${mimeType};end`;
  };
  
  $('extBtn').onclick = () => {
    if (!S.currentItem) return alert('ไม่มีลิงก์วิดีโอ');
    const url = S.currentItem.url;
    const mimeType = getMimeType(url);
    const u = url.replace(/^https?:\/\//, '');
    window.location.href = `intent://${u}#Intent;action=android.intent.action.VIEW;type=${mimeType};scheme=https;end`;
  };
  
  $('copyLinkBtn').onclick = async () => {
    if (!S.currentItem) return;
    try {
      await navigator.clipboard.writeText(S.currentItem.url);
      alert('✅ คัดลอกลิงก์แล้ว!');
    } catch(e) {
      alert('❌ คัดลอกไม่ได้: ' + e.message);
    }
  };
}

init();
</script>
